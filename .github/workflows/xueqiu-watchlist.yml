name: Xueqiu watchlist monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: xueqiu-watchlist-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install -r cloud/github-requirements.txt

      - name: Find latest encrypted state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const previous = artifacts
              .filter(a => a.name === "xueqiu-watchlist-state" && !a.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            core.setOutput("artifact_id", previous ? String(previous.id) : "");
            core.setOutput("run_id", previous?.workflow_run?.id ? String(previous.workflow_run.id) : "");

      - name: Download previous encrypted state
        if: steps.previous.outputs.artifact_id != '' && steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          run-id: ${{ steps.previous.outputs.run_id }}
          merge-multiple: true
          path: state-in
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore database
        if: steps.previous.outputs.artifact_id != '' && steps.previous.outputs.run_id != ''
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m cloud.state_crypto decrypt --input state-in/watchlist.sqlite3.enc --db data/xueqiu_watchlist.sqlite3

      - name: Collect watchlists and send Bark notifications
        env:
          XUEQIU_USERS: ${{ secrets.XUEQIU_USERS }}
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          DATABASE_PATH: ${{ github.workspace }}/data/xueqiu_watchlist.sqlite3
          RUN_ONCE: "1"
          LOG_LEVEL: INFO
        run: python -m cloud.worker

      - name: Encrypt updated database
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m cloud.state_crypto encrypt --db data/xueqiu_watchlist.sqlite3 --output state-out/watchlist.sqlite3.enc

      - name: Save encrypted state
        id: save-state
        uses: actions/upload-artifact@v4
        with:
          name: xueqiu-watchlist-state
          path: state-out/watchlist.sqlite3.enc
          if-no-files-found: error
          retention-days: 1

      - name: Remove older state artifacts
        uses: actions/github-script@v7
        env:
          CURRENT_ARTIFACT_ID: ${{ steps.save-state.outputs.artifact-id }}
        with:
          script: |
            const currentId = Number(process.env.CURRENT_ARTIFACT_ID);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts) {
              if (artifact.name === "xueqiu-watchlist-state" && artifact.id !== currentId) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
